<a
  href="#conteudo"
  class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:rounded-md focus:bg-background focus:px-4 focus:py-2 focus:text-foreground focus:shadow-lg focus:ring-2 focus:ring-ring"
  (click)="pularParaConteudo($event)"
>
  Pular para o conteúdo
</a>
<header class="border-b bg-card text-card-foreground">
  <div
    class="mx-auto flex w-full flex-wrap items-center justify-between gap-3 px-4 py-4 md:max-w-7/10 md:px-0"
  >
    <div class="flex items-center gap-3">
      <button
        type="button"
        class="rounded-md"
        aria-label="Ir para a página inicial"
        (click)="enviaInicio()"
      >
        <img width="100" height="71" src="./assets/brasao.png" alt="" />
      </button>
      <span class="max-w-60 text-lg leading-snug">
        Polícia Judiciária Civil Estado de Mato Grosso
      </span>
    </div>

    <div class="flex items-center gap-2">
      <h1 class="text-3xl font-semibold tracking-tight">Desaparecidos</h1>
      <!--
        Mesmas classes do hlmBtn ghost/icon do estilo vega (buttonVariants), sem
        a diretiva: o cabeçalho fica no bundle inicial, e a diretiva traria o
        tailwind-merge e o overlay do CDK para ele. O app.component.spec.ts
        compara as duas listas. Um ícone só, com o nome por binding: o HTML
        pré-renderizado e o navegador têm a mesma estrutura (sem @if), então a
        hidratação não diverge quando a pessoa escolheu o claro.
      -->
      <button
        class="focus-visible:border-ring focus-visible:ring-ring/50 data-[matches-spartan-invalid=true]:ring-destructive/20 dark:data-[matches-spartan-invalid=true]:ring-destructive/40 data-[matches-spartan-invalid=true]:border-destructive dark:data-[matches-spartan-invalid=true]:border-destructive/50 rounded-md border border-transparent bg-clip-padding text-sm font-medium focus-visible:ring-3 active:not-aria-[haspopup]:translate-y-px data-[matches-spartan-invalid=true]:ring-3 [&_ng-icon:not([class*='text-'])]:text-[length:--spacing(4)] group/button inline-flex shrink-0 items-center justify-center whitespace-nowrap transition-all outline-none select-none data-disabled:pointer-events-none data-disabled:opacity-50 [&_ng-icon]:pointer-events-none [&_ng-icon]:shrink-0 hover:bg-muted hover:text-foreground dark:hover:bg-muted/50 aria-expanded:bg-muted aria-expanded:text-foreground size-9"
        type="button"
        [attr.aria-label]="rotuloDoTema()"
        [attr.title]="rotuloDoTema()"
        (click)="tema.alternar()"
      >
        <ng-icon
          [name]="tema.modo() === 'escuro' ? 'lucideSun' : 'lucideMoon'"
          aria-hidden="true"
        />
      </button>
    </div>
  </div>
</header>
<main
  #conteudo
  id="conteudo"
  tabindex="-1"
  class="mx-auto w-full px-4 py-6 outline-none md:max-w-7/10 md:px-0"
>
  <router-outlet />
</main>
<!-- Os avisos só aparecem depois de uma ação; o toaster (sonner da spartan)
     carrega quando o navegador fica livre, fora do bundle inicial. -->
@defer (on idle) {
<hlm-toaster [theme]="tema.modo() === 'escuro' ? 'dark' : 'light'" />
}
