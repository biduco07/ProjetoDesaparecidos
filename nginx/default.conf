server {
    # Só IPv4: o Docker entrega ao container por IPv4 mesmo o que chega ao
    # host por IPv6, e um "listen [::]:80" impede o nginx de subir em hosts
    # sem IPv6 no kernel.
    listen 0.0.0.0:80;
    default_type application/octet-stream;

    # Não expõe a versão do nginx e não monta redirecionamentos com a porta
    # interna do container (ex.: /detalhe -> /detalhe/ quando mapeado em 8080).
    server_tokens       off;
    absolute_redirect   off;

    gzip                    on;
    gzip_comp_level         6;
    gzip_vary               on;
    gzip_min_length         1000;
    gzip_proxied            any;
    gzip_types              text/plain text/css application/json application/javascript text/javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_buffers            16 8k;

    root /usr/share/nginx/html/projeto-desaparecidos;

    # Cabeçalhos de segurança. O add_header de um location substitui os do
    # server, por isso o arquivo é incluído em cada location.
    include /etc/nginx/snippets/security-headers.conf;

    # JS e CSS gerados pelo build têm hash no nome: podem ficar em cache
    # para sempre, porque um deploy novo gera nomes novos. Sem "always", o
    # Cache-Control não vai em respostas 404.
    location ~* \.(?:js|mjs|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Imagens e ícones sem hash no nome: cache curto.
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Páginas pré-renderizadas (index.html, detalhe/index.html) e, para
    # qualquer outra rota da SPA, o index.csr.html (o shell sem conteúdo
    # pré-renderizado, que evita hidratar o HTML de outra rota). O HTML não
    # fica em cache para que um deploy novo apareça na hora.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html /index.csr.html;
    }
}
