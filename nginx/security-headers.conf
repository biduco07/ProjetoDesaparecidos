# Incluído pelo default.conf no server e em cada location.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CSP:
# - script-src 'unsafe-inline': o HTML pré-renderizado tem scripts inline do
#   Angular (event replay e carregamento do CSS) que mudam a cada página e a
#   cada build, e o autoCsp do Angular não funciona junto com SSR. Mesmo
#   assim, scripts de outros domínios e eval continuam bloqueados.
# - style-src 'unsafe-inline': o Angular e o Material injetam <style>.
# - connect-src: só a API Abitus. img-src https: as fotos vêm de um storage
#   externo da API.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://abitus-api.geia.vip; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
